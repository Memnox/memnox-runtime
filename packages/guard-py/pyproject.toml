[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memnox-guard"
version = "0.1.0"
description = "Memnox for a Python agent: allow, ask or deny each tool call from your workspace's rules."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Ed25519 is how a bundle and a person's answer are proved; without it nothing signed is believed.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
