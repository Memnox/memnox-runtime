packages:
  - 'packages/*'
  - 'native/noise'
  - 'native/noise/npm/*'

# better-sqlite3 is a native module and must compile; esbuild ships a platform binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# source-map-js is a transitive dev dependency of vitest and tsup pulled below
# GHSA-68fv-2mgg-jv7q; the audit fails the build at high, so hold it at the patched line.
overrides:
  source-map-js: '>=1.2.2'
  # zod under knip (GHSA-mrhx-c7xc-m3w5), held on its own major so the fix is no breaking upgrade.
  zod: '^4.6.6'

# vite is a root devDependency only so the peer vitest installs resolves past
# GHSA-587h-7wmj-h5pm: an override rewrites the peer range and leaves the old resolution.

# braces is a transitive dev dependency of changesets, knip and vitest with no patched
# release yet (GHSA-vfj7-8cjw-p6xm lists none and 3.0.3 is still the latest), so the only
# way past the gate is to ignore it. Drop this line the day a fixed braces ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
