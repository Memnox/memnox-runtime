[package]
name = "memnox-noise"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The one Noise layer the Memnox runtime and the iPhone share, over snow."
publish = false

[lib]
name = "memnox_noise"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
node = ["dep:napi", "dep:napi-derive"]
ffi = []
jni = ["dep:jni"]

[dependencies]
snow = "0.10"
napi = { version = "3", default-features = false, features = ["napi6"], optional = true }
napi-derive = { version = "3", optional = true }
jni = { version = "0.21", default-features = false, optional = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
